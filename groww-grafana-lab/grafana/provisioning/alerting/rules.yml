apiVersion: 1
groups:
  - orgId: 1
    name: groww-alerts
    folder: Groww Alerts
    interval: 10s
    rules:
      # SYMPTOM-BASED: fires on what the customer actually experiences
      # (slow responses), regardless of which dependency causes it.
      - uid: groww-high-p95-latency
        title: "SYMPTOM: P95 latency above 800ms"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))"
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30s
        labels:
          severity: warning
          type: symptom
        annotations:
          summary: "Customers are experiencing P95 latency above 800ms"
          description: "This fires on the observable symptom (slow responses) without assuming a cause -- check the DB pool / cache / Kafka panels next to find which dependency is responsible."

      # CAUSE-ORIENTED: fires on a specific known root cause (the
      # undersized DB pool from this lab) BEFORE it fully saturates and
      # starts producing the symptom above -- a leading indicator.
      - uid: groww-db-pool-saturation
        title: "CAUSE: Postgres connection pool above 90%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "100 * db_pool_in_use / db_pool_max_size"
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 15s
        labels:
          severity: warning
          type: cause
        annotations:
          summary: "Postgres pool utilization above 90%"
          description: "A specific, known root cause: the connection pool (capped at 4) is nearly exhausted. This should fire BEFORE or alongside the P95-latency symptom alert -- correlate the two to confirm causation, not just coincidence."
