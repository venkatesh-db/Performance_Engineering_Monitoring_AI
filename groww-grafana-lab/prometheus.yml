global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: groww-app
    static_configs:
      - targets: ["host.docker.internal:8009"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
